<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - NovaPay</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="container">

        <!-- LOGO -->

        <a href="index.html" class="logo">
            Nova<span>Pay</span>
        </a>


        <!-- TITLE -->

        <h2 id="registerTitle">
            Create Account
        </h2>

        <p id="registerDescription">
            Create your NovaPay account in two simple steps.
        </p>


        <!-- PROGRESS -->

        <div
            id="registerProgress"
            style="
                text-align:center;
                font-size:12px;
                color:#64748b;
                margin-bottom:16px;
            "
        >
            Step 1 of 2
        </div>


        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message"
            style="display:none;"
        ></div>


        <!-- SUCCESS -->

        <div
            id="successMessage"
            class="success-message"
            style="display:none;"
        ></div>


        <!-- ======================================
             STEP 1
        ======================================= -->

        <div id="step1">


            <!-- NICKNAME -->

            <div class="input-group">

                <label for="nickname">
                    Nickname
                </label>

                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                    placeholder="Enter your nickname"
                    autocomplete="nickname"
                    maxlength="30"
                    required
                >

            </div>


            <!-- FIRST NAME -->

            <div class="input-group">

                <label for="firstName">
                    First Name
                </label>

                <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="Enter your first name"
                    autocomplete="given-name"
                    maxlength="50"
                    required
                >

            </div>


            <!-- MIDDLE NAME -->

            <div class="input-group">

                <label for="middleName">
                    Middle Name
                </label>

                <input
                    type="text"
                    id="middleName"
                    name="middleName"
                    placeholder="Enter your middle name"
                    autocomplete="additional-name"
                    maxlength="50"
                >

            </div>


            <!-- SURNAME -->

            <div class="input-group">

                <label for="surname">
                    Surname
                </label>

                <input
                    type="text"
                    id="surname"
                    name="surname"
                    placeholder="Enter your surname"
                    autocomplete="family-name"
                    maxlength="50"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="input-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    inputmode="tel"
                    maxlength="20"
                    required
                >

            </div>


            <!-- NEXT -->

            <button
                type="button"
                id="nextStepBtn"
                style="
                    width:100%;
                    height:46px;
                    border:none;
                    border-radius:11px;
                    background:#2563eb;
                    color:#fff;
                    font-size:14px;
                    font-weight:650;
                    cursor:pointer;
                    margin-top:5px;
                "
            >
                Continue
            </button>

        </div>


        <!-- ======================================
             STEP 2
        ======================================= -->

        <div
            id="step2"
            style="display:none;"
        >


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="password"
                    >
                        Show
                    </button>

                </div>

                <div id="passwordStrength">
                    Use at least 8 characters.
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        data-target="confirmPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- TERMS -->

            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                >

                <label for="terms">

                    I agree to NovaPay's

                    <a href="terms.html">
                        Terms & Conditions
                    </a>

                    and

                    <a href="privacy-policy.html">
                        Privacy Policy
                    </a>.

                </label>

            </div>


            <!-- BACK -->

            <button
                type="button"
                id="backStepBtn"
                style="
                    width:100%;
                    height:42px;
                    border:1px solid #dfe3e8;
                    border-radius:11px;
                    background:#fff;
                    color:#334155;
                    font-size:14px;
                    font-weight:600;
                    cursor:pointer;
                    margin-bottom:9px;
                "
            >
                Back
            </button>


            <!-- CREATE ACCOUNT -->

            <button
                type="button"
                id="registerBtn"
            >
                Create Account
            </button>

        </div>


        <!-- ======================================
             SUCCESS SCREEN
        ======================================= -->

        <div
            id="successScreen"
            style="
                display:none;
                text-align:center;
            "
        >

            <div
                style="
                    width:62px;
                    height:62px;
                    margin:0 auto 14px;
                    border-radius:50%;
                    background:#eff6ff;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:30px;
                "
            >
                ✓
            </div>

            <h2>
                Account Created Successfully
            </h2>

            <p>
                Welcome to NovaPay,
                <strong id="successNickname"></strong>.
            </p>

            <button
                type="button"
                id="continueBtn"
                style="
                    width:100%;
                    height:46px;
                    border:none;
                    border-radius:11px;
                    background:#2563eb;
                    color:#fff;
                    font-size:14px;
                    font-weight:650;
                    cursor:pointer;
                "
            >
                Continue to NovaPay
            </button>

        </div>


        <!-- LOGIN -->

        <div
            id="loginLink"
            class="bottom-text"
        >

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <!-- REGISTRATION JS -->

    <script
        type="module"
        src="register.js"
    ></script>

</body>

</html>
