<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="View your NovaPay transaction history."
    >

    <title>Transactions — NovaPay</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- NovaPay Transaction History Styles -->
    <link
        rel="stylesheet"
        href="transaction-history.css"
    >

</head>


<body>

    <!-- =================================================
         NOVAPAY TRANSACTION HISTORY
    ================================================== -->

    <main class="transaction-page">


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="transaction-header">

            <button
                type="button"
                id="backBtn"
                class="back-button"
                aria-label="Go back"
            >
                <i class="fa-solid fa-chevron-left"></i>
            </button>


            <h1 class="page-title">
                Transactions
            </h1>


            <button
                type="button"
                id="exportBtn"
                class="download-button"
            >
                Download
            </button>

        </header>


        <!-- =================================================
             FILTERS
        ================================================== -->

        <section
            class="filter-section"
            aria-label="Transaction filters"
        >

            <button
                type="button"
                id="categoryBtn"
                class="filter-button"
                aria-haspopup="dialog"
            >

                <span>
                    All Categories
                </span>

                <i class="fa-solid fa-caret-down"></i>

            </button>


            <button
                type="button"
                id="statusBtn"
                class="filter-button"
                aria-haspopup="dialog"
            >

                <span>
                    All Status
                </span>

                <i class="fa-solid fa-caret-down"></i>

            </button>

        </section>


        <!-- =================================================
             TRANSACTION SUMMARY
        ================================================== -->

        <section class="transaction-summary">


            <!-- SUMMARY HEADER -->

            <div class="summary-header">

                <button
                    type="button"
                    id="monthBtn"
                    class="month-button"
                    aria-haspopup="dialog"
                >

                    <span>
                        This Month
                    </span>

                    <i class="fa-solid fa-caret-down"></i>

                </button>


                <button
                    type="button"
                    id="analysisBtn"
                    class="analysis-button"
                >

                    <i class="fa-solid fa-chart-column"></i>

                    <span>
                        Analysis
                    </span>

                </button>

            </div>


            <!-- IN / OUT -->

            <div class="money-summary">


                <div class="money-summary-item">

                    <span class="summary-label">
                        In
                    </span>

                    <strong
                        id="moneyIn"
                        class="money-in"
                    >
                        ₦0.00
                    </strong>

                </div>


                <div class="summary-divider"></div>


                <div class="money-summary-item">

                    <span class="summary-label">
                        Out
                    </span>

                    <strong
                        id="moneyOut"
                        class="money-out"
                    >
                        ₦0.00
                    </strong>

                </div>

            </div>


            <!-- ACCESSIBLE / JS SUMMARY VALUE -->

            <p
                id="transactionCount"
                class="transaction-count"
                aria-live="polite"
            >
                Showing 0 Transactions
            </p>


            <p
                id="netAmount"
                class="net-amount"
                aria-hidden="true"
            >
                ₦0.00
            </p>

        </section>


        <!-- =================================================
             TRANSACTIONS
        ================================================== -->

        <section
            class="transactions-section"
            aria-label="Transaction history"
        >

            <div
                id="transactionContainer"
                class="transaction-list"
            >

                <!--
                    IMPORTANT:

                    Do NOT put sample transactions here.

                    Real transactions are inserted by
                    transaction-history.js after the
                    authenticated backend request succeeds.
                -->

            </div>

        </section>


    </main>


    <!-- =================================================
         SHEET OVERLAY
    ================================================== -->

    <div
        id="sheetOverlay"
        class="sheet-overlay"
        aria-hidden="true"
    ></div>


    <!-- =================================================
         CATEGORY SHEET
    ================================================== -->

    <section
        id="categorySheet"
        class="bottom-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="categorySheetTitle"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2 id="categorySheetTitle">
                Categories
            </h2>

            <button
                type="button"
                class="sheet-close"
                onclick="closeSheets()"
                aria-label="Close categories"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="sheet-options">

            <button
                type="button"
                class="sheet-option"
                data-category="All Categories"
            >
                All Categories
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Credit Alert"
            >
                Credit Alert
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Transfer"
            >
                Transfer
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Airtime"
            >
                Airtime
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Data"
            >
                Data
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Electricity"
            >
                Electricity
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="TV"
            >
                TV Subscription
            </button>


            <button
                type="button"
                class="sheet-option"
                data-category="Betting"
            >
                Betting
            </button>

        </div>

    </section>


    <!-- =================================================
         STATUS SHEET
    ================================================== -->

    <section
        id="statusSheet"
        class="bottom-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="statusSheetTitle"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2 id="statusSheetTitle">
                Transaction Status
            </h2>

            <button
                type="button"
                class="sheet-close"
                onclick="closeSheets()"
                aria-label="Close status"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="sheet-options">

            <button
                type="button"
                class="sheet-option"
                data-status="All Status"
            >
                All Status
            </button>


            <button
                type="button"
                class="sheet-option"
                data-status="Successful"
            >
                Successful
            </button>


            <button
                type="button"
                class="sheet-option"
                data-status="Pending"
            >
                Pending
            </button>


            <button
                type="button"
                class="sheet-option"
                data-status="Failed"
            >
                Failed
            </button>

        </div>

    </section>


    <!-- =================================================
         MONTH SHEET
    ================================================== -->

    <section
        id="monthSheet"
        class="bottom-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="monthSheetTitle"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2 id="monthSheetTitle">
                Select Month
            </h2>

            <button
                type="button"
                class="sheet-close"
                onclick="closeSheets()"
                aria-label="Close month selector"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="sheet-options">

            <button
                type="button"
                class="sheet-option"
                data-month="This Month"
            >
                This Month
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="January"
            >
                January
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="February"
            >
                February
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="March"
            >
                March
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="April"
            >
                April
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="May"
            >
                May
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="June"
            >
                June
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="July"
            >
                July
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="August"
            >
                August
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="September"
            >
                September
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="October"
            >
                October
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="November"
            >
                November
            </button>


            <button
                type="button"
                class="sheet-option"
                data-month="December"
            >
                December
            </button>

        </div>

    </section>


    <!-- =================================================
         EXPORT SHEET
    ================================================== -->

    <section
        id="exportSheet"
        class="bottom-sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="exportSheetTitle"
    >

        <div class="sheet-handle"></div>


        <div class="sheet-header">

            <h2 id="exportSheetTitle">
                Download Transactions
            </h2>

            <button
                type="button"
                class="sheet-close"
                onclick="closeSheets()"
                aria-label="Close download menu"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <div class="sheet-options">

            <button
                type="button"
                class="sheet-option sheet-option-icon"
                id="exportPDF"
            >

                <span class="option-icon pdf-icon">
                    <i class="fa-solid fa-file-pdf"></i>
                </span>

                <span>
                    Export as PDF
                </span>

            </button>


            <button
                type="button"
                class="sheet-option sheet-option-icon"
                id="exportCSV"
            >

                <span class="option-icon csv-icon">
                    <i class="fa-solid fa-file-csv"></i>
                </span>

                <span>
                    Export as CSV
                </span>

            </button>


            <button
                type="button"
                class="sheet-option sheet-option-icon"
                id="printHistory"
            >

                <span class="option-icon print-icon">
                    <i class="fa-solid fa-print"></i>
                </span>

                <span>
                    Print
                </span>

            </button>

        </div>

    </section>


    <!-- =================================================
         JAVASCRIPT
    ================================================== -->

    <script
        type="module"
        src="transaction-history.js"
    ></script>

</body>

</html>
