<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NovaPay</title>

    <link
        rel="stylesheet"
        href="login-pin.css">

</head>

<body>

    <main class="pin-container">

        <!-- LOGO -->

        <div class="logo">

            <img
                src="images/logo.png"
                alt="NovaPay"
                id="appLogo">

        </div>

        <!-- TITLE -->

        <h1 id="pageTitle">

            Create Login PIN

        </h1>

        <p
            id="pageSubtitle">

            Create a secure 6-digit PIN to protect your account.

        </p>

        <!-- PIN BOXES -->

        <div class="pin-boxes">

            <div class="pin-box"></div>
            <div class="pin-box"></div>
            <div class="pin-box"></div>
            <div class="pin-box"></div>
            <div class="pin-box"></div>
            <div class="pin-box"></div>

        </div>

        <!-- NUMBER PAD -->

        <div class="number-pad">

            <button class="num-btn" data-number="1">1</button>
            <button class="num-btn" data-number="2">2</button>
            <button class="num-btn" data-number="3">3</button>

            <button class="num-btn" data-number="4">4</button>
            <button class="num-btn" data-number="5">5</button>
            <button class="num-btn" data-number="6">6</button>

            <button class="num-btn" data-number="7">7</button>
            <button class="num-btn" data-number="8">8</button>
            <button class="num-btn" data-number="9">9</button>

            <div></div>

            <button
                class="num-btn"
                data-number="0">

                0

            </button>

            <button
                id="deleteBtn"
                class="num-btn">

                ⌫

            </button>

        </div>

    </main>

    <script
        type="module"
        src="login-pin.js">

    </script>

</body>

</html>
