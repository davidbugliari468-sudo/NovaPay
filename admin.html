<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaPay Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">
        <div>
            <span class="brand">Nova<span>Pay</span></span>
            <small>Admin</small>
        </div>

        <button id="logoutBtn">
            Logout
        </button>
    </header>


    <main class="admin-container">

        <div class="page-heading">
            <h1>Dashboard</h1>
            <p>NovaPay overview</p>
        </div>


        <section class="stats-grid">

            <div class="stat-card">
                <span>Users</span>
                <strong id="totalUsers">0</strong>
            </div>

            <div class="stat-card">
                <span>Transactions</span>
                <strong id="totalTransactions">0</strong>
            </div>

            <div class="stat-card">
                <span>Total Deposits</span>
                <strong id="totalDeposits">₦0.00</strong>
            </div>

        </section>


        <section class="admin-section">

            <div class="section-title">
                <h2>Quick Access</h2>
            </div>

            <div class="admin-actions">

                <button class="action-card" id="usersBtn">
                    <div class="action-icon">👤</div>

                    <div>
                        <strong>Users</strong>
                        <p>View NovaPay users</p>
                    </div>

                    <span>›</span>
                </button>


                <button class="action-card" id="transactionsBtn">
                    <div class="action-icon">↔</div>

                    <div>
                        <strong>Transactions</strong>
                        <p>View recent transactions</p>
                    </div>

                    <span>›</span>
                </button>


                <button class="action-card" id="supportBtn">
                    <div class="action-icon">?</div>

                    <div>
                        <strong>Support</strong>
                        <p>Customer support</p>
                    </div>

                    <span>›</span>
                </button>

            </div>

        </section>


        <section class="admin-section">

            <div class="section-title">
                <h2>Recent Activity</h2>

                <button id="viewAllBtn">
                    View all
                </button>
            </div>

            <div id="recentActivity" class="activity-list">

                <div class="empty-state">
                    No recent activity
                </div>

            </div>

        </section>

    </main>


    <script type="module" src="admin.js"></script>

</body>
</html>
