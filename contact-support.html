<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact Support - NovaPay</title>

    <link
        rel="stylesheet"
        href="contact-support.css"
    >
</head>

<body>

    <div class="support-page">

        <!-- HEADER -->
        <header class="support-header">

            <button
                class="back-btn"
                id="backBtn"
                aria-label="Go back"
            >
                ←
            </button>

            <h1>Contact Support</h1>

        </header>


        <!-- INTRO -->
        <section class="support-intro">

            <div class="support-icon">
                🎧
            </div>

            <div class="intro-text">

                <h2>We're here to help</h2>

                <p>
                    Choose how you'd like to contact
                    NovaPay Support.
                </p>

            </div>

        </section>


        <!-- SUPPORT OPTIONS -->
        <section class="support-section">

            <h3>SUPPORT OPTIONS</h3>


            <!-- MESSAGE SUPPORT -->
            <button
                class="support-card coming-soon"
                type="button"
                data-service="Message Support"
            >

                <div class="card-icon message-icon">
                    💬
                </div>

                <div class="card-content">

                    <h4>Message Support</h4>

                    <p>
                        Chat with our support team
                        about your account and services.
                    </p>

                </div>

                <span class="status">
                    Coming Soon
                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <!-- EMAIL SUPPORT -->
            <button
                class="support-card coming-soon"
                type="button"
                data-service="Email Support"
            >

                <div class="card-icon email-icon">
                    ✉
                </div>

                <div class="card-content">

                    <h4>Email Support</h4>

                    <p>
                        Send us an email about your
                        account or any issue you're facing.
                    </p>

                </div>

                <span class="status">
                    Coming Soon
                </span>

                <span class="arrow">
                    ›
                </span>

            </button>


            <!-- SECURITY -->
            <button
                class="support-card coming-soon"
                type="button"
                data-service="Report a Security Issue"
            >

                <div class="card-icon security-icon">
                    🛡️
                </div>

                <div class="card-content">

                    <h4>Report a Security Issue</h4>

                    <p>
                        Report suspicious activity
                        or a security concern.
                    </p>

                </div>

                <span class="status">
                    Coming Soon
                </span>

                <span class="arrow">
                    ›
                </span>

            </button>

        </section>


        <!-- INFORMATION -->
        <section class="support-notice">

            <div class="notice-icon">
                ℹ
            </div>

            <div>

                <h3>NovaPay Support</h3>

                <p>
                    Support features are being prepared
                    and will become available as
                    NovaPay grows.
                </p>

            </div>

        </section>

    </div>


    <script
        type="module"
        src="contact-support.js"
    ></script>

</body>
</html>
