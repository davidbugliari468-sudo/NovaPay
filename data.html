<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Buy Data</title>

    <link rel="stylesheet" href="data.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="data-page">

    <!-- HEADER -->

    <header class="page-header">

        <button id="backBtn" class="back-btn">

            <i class="fas fa-arrow-left"></i>

        </button>

        <div class="header-content">

            <h1>Buy Data</h1>

            <p>Purchase data bundles for all networks.</p>

        </div>

    </header>

    <!-- SERVICE PROVIDER -->

    <section class="section">

        <h2>Service Provider</h2>

        <div class="network-grid">

            <div class="network-card active"
                data-network="MTN">

                <img
                    src="images/mtn.png"
                    alt="MTN">

            </div>

            <div class="network-card"
                data-network="Airtel">

                <img
                    src="images/airtel.png"
                    alt="Airtel">

            </div>

            <div class="network-card"
                data-network="Glo">

                <img
                    src="images/glo.png"
                    alt="Glo">

            </div>

            <div class="network-card"
                data-network="9mobile">

                <img
                    src="images/9mobile.png"
                    alt="9mobile">

            </div>

        </div>

    </section>     <!-- PHONE NUMBER -->

    <section class="section">

        <div class="section-title">

            <h2>Phone Number</h2>

            <button
                id="beneficiaryBtn"
                class="beneficiary-btn">

                <i class="fas fa-user"></i>

                Beneficiaries

            </button>

        </div>

        <div class="input-card">

            <input
                type="tel"
                id="phoneNumber"
                maxlength="11"
                placeholder="Enter phone number">

        </div>

        <label class="save-beneficiary">

            <input
                type="checkbox"
                id="saveBeneficiary">

            <span>Save Beneficiary</span>

        </label>

    </section>

    <!-- DATA BALANCE -->

    <section class="section">

        <div class="balance-card">

            <div class="balance-left">

                <i class="fas fa-signal"></i>

                <span>Data Balance</span>

            </div>

            <button
                id="checkBalanceBtn"
                class="balance-btn">

                *323*4#

            </button>

        </div>

    </section>

    <!-- PLAN CATEGORIES -->

    <section class="section">

        <div class="plan-tabs">

            <button class="plan-tab active">🔥 Hot</button>

            <button class="plan-tab">Daily</button>

            <button class="plan-tab">Weekly</button>

            <button class="plan-tab">Monthly</button>

            <button class="plan-tab">Router</button>

            <button class="plan-tab">Social</button>

            <button class="plan-tab">Night</button>

            <button class="plan-tab">SME</button>

        </div>

        <div
            id="plansContainer"
            class="plans-grid">

        </div>

    </section> 
        <!-- CONTINUE BUTTON -->

    <button
        id="continueBtn"
        class="continue-btn">

        Continue

    </button>

</div>

<script src="data.js"></script>

</body>

</html>
