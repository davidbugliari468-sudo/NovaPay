<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F5F7FC"
    >

    <title>Buy Data</title>

    <link
        rel="stylesheet"
        href="data.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="data-page">

    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="page-header">

        <button
            id="backBtn"
            class="back-btn"
            type="button"
            aria-label="Go back"
        >
            <i class="fas fa-arrow-left"></i>
        </button>

        <div class="header-content">

            <h1>Buy Data</h1>

            <p>
                Purchase data bundles for all networks.
            </p>

        </div>

    </header>


    <!-- ==========================================
         SERVICE PROVIDER
    =========================================== -->

    <section class="section provider-section">

        <h2>
            Service Provider
        </h2>

        <div class="network-grid">

            <button
                class="network-card active"
                data-network="MTN"
                type="button"
                aria-selected="true"
                aria-label="MTN"
            >
                <img
                    src="images/mtn.png"
                    alt="MTN"
                >
            </button>

            <button
                class="network-card"
                data-network="Airtel"
                type="button"
                aria-selected="false"
                aria-label="Airtel"
            >
                <img
                    src="images/airtel.png"
                    alt="Airtel"
                >
            </button>

            <button
                class="network-card"
                data-network="Glo"
                type="button"
                aria-selected="false"
                aria-label="Glo"
            >
                <img
                    src="images/glo.png"
                    alt="Glo"
                >
            </button>

            <button
                class="network-card"
                data-network="9mobile"
                type="button"
                aria-selected="false"
                aria-label="9mobile"
            >
                <img
                    src="images/9mobile.png"
                    alt="9mobile"
                >
            </button>

        </div>

    </section>


    <!-- ==========================================
         PHONE NUMBER
    =========================================== -->

    <section class="section phone-section">

        <div class="section-title">

            <h2>
                Phone Number
            </h2>

            <button
                id="beneficiaryBtn"
                class="beneficiary-btn"
                type="button"
            >
                <i class="fas fa-user"></i>

                <span>
                    Beneficiaries
                </span>
            </button>

        </div>


        <div class="input-card">

            <input
                type="tel"
                id="phoneNumber"
                maxlength="11"
                inputmode="numeric"
                autocomplete="tel"
                placeholder="Enter phone number"
                aria-label="Phone number"
            >

        </div>


        <label
            class="save-beneficiary"
            for="saveBeneficiary"
        >

            <input
                type="checkbox"
                id="saveBeneficiary"
            >

            <span>
                Save Beneficiary
            </span>

        </label>

    </section>


    <!-- ==========================================
         DATA PLANS
    =========================================== -->

    <section class="section plans-section">

        <div class="plans-heading">

            <h2>
                Data Plans
            </h2>

        </div>


        <!-- CATEGORY TABS -->

        <div
            class="plan-tabs-wrapper"
            aria-label="Data plan categories"
        >

            <div
                class="plan-tabs"
                role="tablist"
            >

                <button
                    class="plan-tab active"
                    data-category="Hot"
                    type="button"
                    role="tab"
                    aria-selected="true"
                >
                    🔥 Hot
                </button>

                <button
                    class="plan-tab"
                    data-category="Daily"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Daily
                </button>

                <button
                    class="plan-tab"
                    data-category="Weekly"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Weekly
                </button>

                <button
                    class="plan-tab"
                    data-category="Monthly"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Monthly
                </button>

                <button
                    class="plan-tab"
                    data-category="Router"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Router
                </button>

                <button
                    class="plan-tab"
                    data-category="Night"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Night
                </button>

                <button
                    class="plan-tab"
                    data-category="SME"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    SME
                </button>

                <button
                    class="plan-tab"
                    data-category="Extra Value"
                    type="button"
                    role="tab"
                    aria-selected="false"
                >
                    Extra Value
                </button>

            </div>

        </div>


        <!-- ======================================
             FIXED DATA PLAN BOX

             The box stays a fixed height.
             The plans inside it scroll.
        ======================================= -->

        <div class="plans-box">

            <div
                id="plansContainer"
                class="plans-grid"
                aria-live="polite"
            ></div>

        </div>

    </section>


    <!-- ==========================================
         CONTINUE
    =========================================== -->

    <button
        id="continueBtn"
        class="continue-btn"
        type="button"
        disabled
    >
        Continue
    </button>

</div>


<!-- ==========================================
     DATA JAVASCRIPT
=========================================== -->

<script
    type="module"
    src="data.js"
></script>

</body>
</html>
