<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <title>Login | NovaPay</title>

    <link rel="stylesheet" href="login.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="login-page">

        <!-- =========================================
             NOVAPAY BRAND
        ========================================== -->

        <a
            href="index.html"
            class="login-logo"
            aria-label="NovaPay home"
        >
            Nova<span>Pay</span>
        </a>


        <!-- =========================================
             LOGIN HEADER
        ========================================== -->

        <header class="login-header">

            <h1>
                Log in to your Account
            </h1>

            <p>
                Welcome back!
            </p>

        </header>


        <!-- =========================================
             LOGIN CARD
        ========================================== -->

        <section class="login-card">

            <form
                id="loginForm"
                novalidate
            >

                <!-- =================================
                     EMAIL
                ================================== -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email Address"
                        autocomplete="email"
                        inputmode="email"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >

                </div>


                <!-- =================================
                     PASSWORD
                ================================== -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- =================================
                     OPTIONS
                ================================== -->

                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        id="forgotPassword"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- =================================
                     LOGIN BUTTON
                ================================== -->

                <button
                    id="loginBtn"
                    class="login-button"
                    type="submit"
                >
                    Login
                </button>


                <!-- =================================
                     CREATE ACCOUNT
                ================================== -->

                <p class="register-link">

                    Don't have an account?

                    <a href="register.html">
                        Create an account
                    </a>

                </p>

            </form>

        </section>

    </main>


    <!-- =========================================
         CUSTOM MODAL
    ========================================== -->

    <div
        id="customModal"
        class="custom-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        aria-describedby="modalMessage"
    >

        <div class="custom-modal-content">

            <h3 id="modalTitle">
                NovaPay
            </h3>

            <p id="modalMessage"></p>

            <button
                id="modalButton"
                type="button"
            >
                OK
            </button>

        </div>

    </div>


    <!-- =========================================
         LOGIN JAVASCRIPT
    ========================================== -->

    <script
        type="module"
        src="login.js"
    ></script>

</body>
</html>
