<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - NovaPay</title>
</head>

<body>

    <main>

        <h1>Change Password</h1>

        <p>
            Enter the email address you used to register your
            NovaPay account.
        </p>

        <form id="forgotPasswordForm">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                id="changePasswordButton"
            >
                Change Password
            </button>

        </form>


        <div
            id="message"
            role="status"
            aria-live="polite"
        ></div>


        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </main>


    <script type="module">

        import { auth } from "./firebase.js";

        import {
            sendPasswordResetEmail
        } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


        // =================================================
        // ELEMENTS
        // =================================================

        const form =
            document.getElementById("forgotPasswordForm");

        const emailInput =
            document.getElementById("email");

        const changePasswordButton =
            document.getElementById("changePasswordButton");

        const message =
            document.getElementById("message");


        // =================================================
        // FORM SUBMISSION
        // =================================================

        form.addEventListener("submit", async function (e) {

            e.preventDefault();


            const email =
                emailInput.value.trim();


            if (!email) {

                message.textContent =
                    "Please enter your registered email address.";

                return;
            }


            changePasswordButton.disabled = true;

            changePasswordButton.textContent =
                "Sending...";

            message.textContent = "";


            try {

                // =========================================
                // PASSWORD RESET EMAIL
                // =========================================

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                // =========================================
                // SUCCESS
                // =========================================

                message.textContent =
                    "We've sent a password reset link to your email. Open your inbox or Spam folder and use the link to change your password.";


                emailInput.value = "";


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                message.textContent =
                    "We couldn't send the password reset email. Please check the email address and try again.";

            } finally {

                changePasswordButton.disabled = false;

                changePasswordButton.textContent =
                    "Change Password";
            }

        });

    </script>

</body>
</html>
