<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | NovaPay</title>

    <link rel="stylesheet" href="payment-success.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h1>Payment Successful</h1>

        <p class="success-message">
            Your payment has been received successfully.
            Your NovaPay wallet is being updated.
        </p>

        <div class="payment-summary">

            <div class="summary-row">
                <span>Amount Paid</span>
                <strong id="amountPaid">₦0.00</strong>
            </div>

            <div class="summary-row">
                <span>Status</span>
                <strong class="success-text">Successful</strong>
            </div>

        </div>

        <div class="progress-area">

            <div class="progress-bar">

                <div class="progress-fill"
                id="progressFill"></div>

            </div>

            <p id="redirectText">
                Redirecting to dashboard...
            </p>

        </div>

    </div>

</div>

<script src="payment-success.js"></script>

</body>
</html>
