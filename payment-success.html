<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful | NovaPay</title>

    <link rel="stylesheet" href="payment-success.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>

        <h2 class="logo">NovaPay</h2>

        <h1>Payment Successful</h1>

        <p class="message">
            Your payment has been received successfully.
        </p>

        <p class="message">
            Your NovaPay wallet is being updated.
        </p>

        <div class="status">
            Status:
            <span>Successful</span>
        </div>

        <button id="okBtn">
            OK
        </button>

        <p class="redirect-text">
            Please wait while we return you to your NovaPay wallet.
        </p>

    </div>

</div>

<script src="payment-success.js"></script>

</body>
</html>
