<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Security PIN | NovaPay</title>

<link rel="stylesheet" href="create-pin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="create-pin-page">

<header class="page-header">

<button id="backBtn" class="back-btn">

<i class="fa-solid fa-arrow-left"></i>

</button>

</header>

<section class="intro">

<h1>Create Security PIN</h1>

<p>

Protect your NovaPay account with a
6-digit Security PIN.

</p>

<div class="shield-icon">

<i class="fa-solid fa-shield-halved"></i>

</div>

</section>

<section class="pin-section">

<h3>Enter Security PIN</h3>

<div
id="enterPinDots"
class="pin-dots">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

<input
id="enterPin"
class="hidden-pin"
type="password"
inputmode="numeric"
maxlength="6"
autocomplete="new-password">

</section>

<section class="pin-section">

<h3>Confirm Security PIN</h3>

<div
id="confirmPinDots"
class="pin-dots">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

<input
id="confirmPin"
class="hidden-pin"
type="password"
inputmode="numeric"
maxlength="6"
autocomplete="new-password">

</section>

<p
id="statusMessage"
class="status-message">

</p>

<button
id="createPinBtn"
class="create-pin-btn">

Create Security PIN

</button>

</div>

<script type="module" src="create-pin.js"></script>

</body>

</html>
