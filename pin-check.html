<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NovaPay</title>

    <link
        rel="stylesheet"
        href="pin-check.css">

</head>

<body>

    <div class="novapay-loading">

    <div class="novapay-brand">
        NovaPay
    </div>

    <div class="progress-circle">

        <svg
            class="progress-ring"
            viewBox="0 0 120 120"
        >

            <circle
                class="progress-track"
                cx="60"
                cy="60"
                r="50"
            ></circle>

            <circle
                class="progress-bar"
                cx="60"
                cy="60"
                r="50"
            ></circle>

        </svg>

        <div class="progress-content">

            <span id="progress-number">
                0
            </span>

            <span class="progress-percent">
                %
            </span>

        </div>

    </div>

</div>

    <script
        type="module"
        src="pin-check.js">

    </script>

</body>

</html>
