<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#F5F7FC"
    >

    <title>NovaPay Receipt</title>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link
        rel="stylesheet"
        href="receipt.css"
    >

</head>

<body>

    <main class="receipt-page">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="receipt-header">

            <button
                type="button"
                id="backBtn"
                class="back-btn"
                aria-label="Go back"
            >

                <i
                    class="fas fa-chevron-left"
                    aria-hidden="true"
                ></i>

            </button>

            <h1>
                Receipt
            </h1>

            <div
                class="header-space"
                aria-hidden="true"
            ></div>

        </header>


        <!-- =========================
             MAIN RECEIPT
        ========================== -->

        <section
            class="receipt-card"
            aria-label="Transaction receipt"
        >

            <!-- =====================
                 STATUS / AMOUNT
            ====================== -->

            <div class="receipt-top">

                <div
                    id="receiptIcon"
                    class="status-icon success"
                    aria-hidden="true"
                >

                    <i class="fas fa-check"></i>

                </div>


                <div class="receipt-heading">

                    <h2 id="transactionTitle">
                        Credit Alert
                    </h2>

                    <p id="transactionStatus">
                        Successful
                    </p>

                </div>


                <h2
                    id="amount"
                    class="receipt-amount credit-amount"
                >
                    +₦0.00
                </h2>

            </div>


            <!-- =====================
                 TRANSACTION DETAILS
            ====================== -->

            <div class="receipt-details">


                <div class="detail-row">

                    <div class="detail-label">

                        <span>
                            Recipient
                        </span>

                    </div>

                    <strong id="recipient">
                        NovaPay Wallet
                    </strong>

                </div>


                <div class="detail-row">

                    <div class="detail-label">

                        <span>
                            Transaction Amount
                        </span>

                    </div>

                    <strong id="amountText">
                        +₦0.00
                    </strong>

                </div>


                <div class="detail-row">

                    <div class="detail-label">

                        <span>
                            Transaction Date
                        </span>

                    </div>

                    <strong id="date">
                        --
                    </strong>

                </div>


                <div class="detail-row">

                    <div class="detail-label">

                        <span>
                            Reference No.
                        </span>

                    </div>

                    <strong id="transactionId">
                        NVP000000
                    </strong>

                </div>


                <div class="detail-row">

                    <div class="detail-label">

                        <span>
                            Category
                        </span>

                    </div>

                    <strong id="category">
                        Credit Alert
                    </strong>

                </div>


                <div class="detail-row last-row">

                    <div class="detail-label">

                        <span>
                            Status
                        </span>

                    </div>

                    <strong id="statusText">
                        Successful
                    </strong>

                </div>


            </div>

        </section>


        <!-- =========================
             SUPPORT
        ========================== -->

        <button
            type="button"
            id="supportBtn"
            class="support-card"
        >

            <span class="support-left">

                <span
                    class="support-icon"
                    aria-hidden="true"
                >

                    <i class="fas fa-headset"></i>

                </span>


                <span class="support-content">

                    <strong>
                        Need help?
                    </strong>

                    <small>
                        Contact NovaPay Support
                    </small>

                </span>

            </span>


            <i
                class="fas fa-chevron-right support-arrow"
                aria-hidden="true"
            ></i>

        </button>


        <!-- =========================
             DONE
        ========================== -->

        <button
            type="button"
            id="doneBtn"
            class="done-btn"
        >
            Done
        </button>

    </main>


    <!-- =========================
         RECEIPT JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="receipt.js"
    ></script>

</body>

</html>
