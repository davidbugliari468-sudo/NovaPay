<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NovaPay Receipt</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="receipt.css">

</head>

<body>

<div class="receipt-page">

<!-- ===========================
HEADER
=========================== -->

<header class="receipt-header">

<button id="backBtn" class="back-btn">

<i class="fas fa-arrow-left"></i>

</button>

<h1>Receipt</h1>

<div class="header-space"></div>

</header>

<!-- ===========================
RECEIPT CARD
=========================== -->

<section class="receipt-card">

<div class="receipt-top">

<div id="receiptIcon" class="status-icon">

<i class="fas fa-check"></i>

</div>

<h2 id="transactionTitle">

Credit Alert

</h2>

<p id="transactionStatus">

Successful

</p>

<h1 id="amount">

+₦0.00

</h1>

</div>

<div class="receipt-details"> 
    <div class="detail-row">

<span>

Recipient

</span>

<strong id="recipient">

NovaPay Wallet

</strong>

</div>

<div class="detail-row">

<span>

Transaction Amount

</span>

<strong id="amountText">

+₦0.00

</strong>

</div>

<div class="detail-row">

<span>

Transaction Date

</span>

<strong id="date">

--

</strong>

</div>

<div class="detail-row">

<span>

Reference No.

</span>

<strong id="transactionId">

NVP000000

</strong>

</div>

<div class="detail-row">

<span>

Category

</span>

<strong id="category">

Credit Alert

</strong>

</div>

<div class="detail-row">

<span>

Status

</span>

<strong id="statusText">

Successful

</strong>

</div>

</div>

</section> 
<!-- ===========================
SUPPORT
=========================== -->

<section
id="supportBtn"
class="support-card">

<div class="support-left">

<div class="support-icon">

<i class="fas fa-headset"></i>

</div>

<div>

<h3>

Contact NovaPay Support

</h3>

<p>

Need help with this transaction?

</p>

</div>

</div>

<i class="fas fa-chevron-right"></i>

</section>

<!-- ===========================
DONE BUTTON
=========================== -->

<button
id="doneBtn"
class="done-btn">

Done

</button>

</div>

<script
type="module"
src="receipt.js">

</script>

</body>

</html>
