<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NovaPay Receipt</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="receipt.css">

</head>

<body>

<div class="receipt-page">

<header class="top-bar">

<button id="backBtn" class="back-btn">

<i class="fas fa-arrow-left"></i>

</button>

<h2>Receipt</h2>

<div></div>

</header>



<div class="receipt-card">

<div class="success-area">

<div class="success-icon" id="receiptIcon">

<i class="fas fa-check"></i>

</div>

<h3 id="transactionTitle">

Wallet Funding

</h3>

<p id="transactionStatus">

Successful

</p>

</div>



<div class="receipt-details">

<div class="detail-row">

<span>Recipient</span>

<strong id="recipient">

NovaPay Wallet

</strong>

</div>

<div class="detail-row">

<span>Amount</span>

<strong id="amount">

₦0.00

</strong>

</div>

<div class="detail-row">

<span>Date</span>

<strong id="date">

--

</strong>

</div>

<div class="detail-row">

<span>Reference</span>

<div class="reference-box">

<strong id="transactionId">

NVP000000

</strong>

<button id="copyBtn">

<i class="far fa-copy"></i>

</button>

</div>

</div>

<div class="detail-row">

<span>Status</span>

<strong id="statusText">

Successful

</strong>

</div>

</div>

</div>



<div class="support-row" id="supportBtn">

<div class="support-left">

<i class="fas fa-headset"></i>

<div>

<h4>Contact Support</h4>

<p>NovaPay Support</p>

</div>

</div>

<i class="fas fa-chevron-right"></i>

</div>



<button class="done-btn" id="doneBtn">

Done

</button>

</div>

<script type="module" src="receipt.js"></script>

</body>

</html>
