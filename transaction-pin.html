<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction PIN | NovaPay</title>

    <link rel="stylesheet" href="transaction-pin.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="page-header">

        <button class="back-btn" onclick="history.back()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <h1>Transaction PIN</h1>

    </header>

    <!-- Security Card -->

    <section class="security-card">

        <div class="shield">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Create Transaction PIN</h2>

        <p>Secure your wallet with a 4-digit PIN.</p>

    </section>

    <!-- New PIN -->

    <h3 class="section-title">Enter New PIN</h3>

    <div class="pin-row">

        <input class="pin-input new-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input new-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input new-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input new-pin" maxlength="1" inputmode="numeric" type="password">

    </div>

    <!-- Confirm PIN -->

    <h3 class="section-title">Confirm PIN</h3>

    <div class="pin-row">

        <input class="pin-input confirm-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input confirm-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input confirm-pin" maxlength="1" inputmode="numeric" type="password">

        <input class="pin-input confirm-pin" maxlength="1" inputmode="numeric" type="password">

    </div>

    <!-- Requirements -->

    <div class="requirements">

        <p class="green">
            PIN must contain exactly 4 digits.
        </p>

        <p class="orange">
            Avoid easy PINs like 1234 or 0000.
        </p>

        <p class="red">
            Never share your Transaction PIN.
        </p>

        <p class="blue">
            Required for every transaction.
        </p>

    </div>

    <button class="create-btn" disabled>

        <i class="fa-solid fa-lock"></i>

        Create Transaction PIN

    </button>

</div>

<script src="transaction-pin.js"></script>

</body>
</html>
