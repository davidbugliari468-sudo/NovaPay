<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Transaction PIN</title>

<link rel="stylesheet" href="transaction-pin.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="pin-page">

<header class="page-header">

<button id="backBtn" class="back-btn">

<i class="fas fa-arrow-left"></i>

</button>

<div class="header-content">

<h1>Transaction PIN</h1>

<p>Create a secure 4-digit PIN for your transactions.</p>

</div>

</header>

<section class="pin-card">

<div class="pin-icon">

<i class="fas fa-shield-alt"></i>

</div>

<h2>Create Transaction PIN</h2>

<p>Your PIN will be required before completing payments.</p>

</section> 
<!-- NEW PIN -->

<section class="pin-section">

<h3>New PIN</h3>

<div id="newPinContainer" class="pin-inputs">

<input class="pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="pin-input" type="password" maxlength="1" inputmode="numeric">

</div>

<p id="pinStrength" class="pin-status"></p>

</section>

<!-- CONFIRM PIN -->

<section class="pin-section">

<h3>Confirm PIN</h3>

<div id="confirmPinContainer" class="pin-inputs">

<input class="confirm-pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="confirm-pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="confirm-pin-input" type="password" maxlength="1" inputmode="numeric">

<input class="confirm-pin-input" type="password" maxlength="1" inputmode="numeric">

</div>

<p id="pinMatch" class="pin-status"></p>

</section>

<p class="pin-note">

Never share your Transaction PIN.

</p> <button
id="createPinBtn"
class="create-pin-btn"
disabled>

Create Transaction PIN

</button>

</div>

<script src="transaction-pin.js"></script>

</body>

</html>
