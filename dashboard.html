<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>NovaPay Dashboard</title>

    <link
        rel="stylesheet"
        href="dashboard.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="dashboard-container"> 
    <!-- ===========================
     HEADER
============================ -->

<header class="header">

    <div class="logo">

        <h2 class="logo-text">

    <span class="logo-nova">Nova</span><span class="logo-pay">Pay</span>

</h2>

    </div>

    <div class="header-actions">

        <button
            id="supportBtn"
            class="icon-button">

            <i class="fa-solid fa-headset"></i>

        </button>

        <button
            id="notificationBtn"
            class="icon-button">

            <i class="fa-regular fa-bell"></i>

        </button>

        <button
            id="profileBtn"
            class="profile-button">

            <i class="fa-solid fa-user"></i>

        </button>

    </div>

</header> 
<!-- ===========================
     GREETING
============================ -->

<section class="greeting-section">

    <p
        id="greetingText"
        class="greeting">

        Good Morning

    </p>

    <h1
        id="userName">

        Loading...

    </h1>

    <span class="welcome-text">

        Welcome back to NovaPay

    </span>

</section> 
<!-- ===========================
     WALLET CARD
============================ -->

<section class="wallet-card">

    <div class="wallet-header">

    <p class="balance-label">

        Available Balance

    </p>

</div>

<div class="wallet-balance-row">

    <h2 id="walletBalance">

        ₦0.00

    </h2>

    <button
        id="hideBalance"
        class="hide-button">

        <i class="fa-regular fa-eye"></i>

        Hide

    </button>

</div>

<div class="wallet-buttons">

    <button
        id="addMoneyBtn"
        class="primary-button">

        <i class="fa-solid fa-plus"></i>

        Add Money

    </button>

    <button
        id="historyBtn"
        class="secondary-button">

        History

        <i class="fa-solid fa-chevron-right"></i>

    </button>

</div>

</section>

<!-- ===========================
     QUICK SERVICES
============================ -->

<section class="services-section">

    <div class="section-header">

        <h2>Quick Services</h2>

    </div>

    <div class="services-grid">

        <!-- Airtime -->

        <button
            id="airtimeBtn"
            class="service-card">

            <div class="service-icon airtime">

                <i class="fa-solid fa-mobile-screen"></i>

            </div>

            <span>Airtime</span>

        </button>

        <!-- Data -->

        <button
            id="dataBtn"
            class="service-card">

            <div class="service-icon data">

                <i class="fa-solid fa-wifi"></i>

            </div>

            <span>Data</span>

        </button>

        <!-- Electricity -->

        <button
            id="electricityBtn"
            class="service-card">

            <div class="service-icon electricity">

                <i class="fa-solid fa-bolt"></i>

            </div>

            <span>Electricity</span>

        </button>

        <!-- TV -->

        <button
            id="tvBtn"
            class="service-card">

            <div class="service-icon tv">

                <i class="fa-solid fa-tv"></i>

            </div>

            <span>TV</span>

        </button>

        <!-- Betting -->

        <button
            id="bettingBtn"
            class="service-card">

            <div class="service-icon betting">

                <i class="fa-solid fa-futbol"></i>

            </div>

            <span>Betting</span>

        </button>

        <!-- More -->

        <button
            id="moreBtn"
            class="service-card">

            <div class="service-icon more">

                <i class="fa-solid fa-ellipsis"></i>

            </div>

            <span>More</span>

        </button>

    </div>

</section> 
<!-- ===========================
     RECENT TRANSACTIONS
============================ -->

<section class="transactions-section">

    <div class="section-header">

        <h2>Recent Transactions</h2>

        <button
            id="viewAllTransactionsBtn"
            class="text-button">

            View All

        </button>

    </div>

    <div class="transaction-card">

        <div class="transaction-icon">

            <i class="fa-solid fa-receipt"></i>

        </div>

        <div class="transaction-details">

            <h4>No Transactions Yet</h4>

            <p>
                Your recent transactions will appear here.
            </p>

        </div>

    </div>

</section> 
<!-- ===========================
     INVITE & EARN
============================ -->

<section class="invite-section">

    <div class="invite-content">

        <div>

            <h3>

                Invite & Earn

            </h3>

            <p>

                Invite your friends and earn reward points when they join NovaPay.

            </p>

        </div>

        <button
            id="inviteBtn"
            class="invite-button">

            Invite

        </button>

    </div>

</section>

<!-- ===========================
     BOTTOM NAVIGATION
============================ -->

<nav class="bottom-nav">

    <button
        class="nav-item active">

        <i class="fa-solid fa-house"></i>

        <span>Home</span>

    </button>

    <button
        id="walletBtn"
        class="nav-item">

        <i class="fa-solid fa-wallet"></i>

        <span>Wallet</span>

    </button>

    <button
        id="payBillsBtn"
        class="nav-item">

        <i class="fa-solid fa-file-invoice-dollar"></i>

        <span>Pay Bills</span>

    </button>

    <button
        id="profileNavBtn"
        class="nav-item">

        <i class="fa-solid fa-user"></i>

        <span>Profile</span>

    </button>

</nav> 
<!-- ===========================
     CUSTOM MODAL
============================ -->

<div
    id="customModal"
    class="modal">

    <div class="modal-content">

        <h2 id="modalTitle">

            NovaPay

        </h2>

        <p id="modalMessage">

            Message

        </p>

        <button
            onclick="closeModal()"
            class="modal-button">

            OK

        </button>

    </div>

</div>

</div>

<script
    type="module"
    src="dashboard.js"></script>

</body>

</html>
