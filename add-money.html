<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Money | NovaPay</title>

    <link rel="stylesheet" href="add-money.css">
</head>
<body>

    <!-- Header -->
    <header class="header">

        <button id="backBtn" class="back-btn">
            ←
        </button>

        <h2>Add Money</h2>

        <div></div>

    </header>

    <!-- Container -->
    <main class="container">

        <!-- Wallet Card -->
        <section class="wallet-card">

            <p>Available Balance</p>

            <h1 id="walletBalance">
                ₦0.00
            </h1>

        </section>

        <!-- Amount -->
        <section class="amount-section">

            <label>
                Enter Amount
            </label>

            <div class="input-box">

                <span>₦</span>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="100"
                >

            </div>

        </section>

        <!-- Quick Amount -->
        <section class="quick-section">

            <h3>Quick Select</h3>

            <div class="quick-grid">

                <button class="quickBtn" data-amount="500">₦500</button>

                <button class="quickBtn" data-amount="1000">₦1,000</button>

                <button class="quickBtn" data-amount="2000">₦2,000</button>

                <button class="quickBtn" data-amount="5000">₦5,000</button>

                <button class="quickBtn" data-amount="10000">₦10,000</button>

                <button class="quickBtn" data-amount="20000">₦20,000</button>

            </div>

        </section>

        <!-- Payment Method -->

        <section class="payment-card">

            <h3>Payment Method</h3>

            <p>🏦 Secure Payment via Monnify</p>

        </section>

        <!-- Continue -->

        <button id="continueBtn" class="continue-btn">

            Continue

        </button>

    </main>

    <!-- Modal -->

    <div id="customModal" class="modal">

        <div class="modal-content">

            <h3 id="modalTitle"></h3>

            <p id="modalMessage"></p>

            <button onclick="closeModal()">

                OK

            </button>

        </div>

    </div>

    <script type="module" src="add-money.js"></script>

</body>
</html>
