<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Money | NovaPay</title>

    <link rel="stylesheet" href="add-money.css">
</head>

<body>

    <!-- ==============================
         HEADER
    =============================== -->

    <header class="header">

        <button id="backBtn" class="back-btn" aria-label="Go back">
            ←
        </button>

        <h2>Add Money</h2>

        <div class="header-space"></div>

    </header>


    <!-- ==============================
         MAIN
    =============================== -->

    <main class="container">


        <!-- ==============================
             BALANCE
        =============================== -->

        <section class="wallet-card">

            <div class="balance-label">
                Available Balance
            </div>

            <h1 id="walletBalance">
                ₦0.00
            </h1>

            <div class="balance-status">
                Wallet balance
            </div>

        </section>


        <!-- ==============================
             AMOUNT
        =============================== -->

        <section class="amount-section">

            <label for="amount">
                How much do you want to add?
            </label>

            <div class="input-box">

                <span class="currency">
                    ₦
                </span>

                <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    min="100"
                    inputmode="decimal"
                >

            </div>

        </section>


        <!-- ==============================
             QUICK AMOUNTS
        =============================== -->

        <section class="quick-section">

            <div class="section-heading">
                Quick amount
            </div>

            <div class="quick-grid">

                <button class="quickBtn" data-amount="500">
                    ₦500
                </button>

                <button class="quickBtn" data-amount="1000">
                    ₦1,000
                </button>

                <button class="quickBtn" data-amount="2000">
                    ₦2,000
                </button>

                <button class="quickBtn" data-amount="5000">
                    ₦5,000
                </button>

                <button class="quickBtn" data-amount="10000">
                    ₦10,000
                </button>

                <button class="quickBtn" data-amount="20000">
                    ₦20,000
                </button>

            </div>

        </section>


        <!-- ==============================
             PAYMENT METHOD
        =============================== -->

        <section class="payment-section">

            <div class="section-heading">
                Payment method
            </div>


            <div class="payment-card">

                <div class="payment-icon">
                    ✓
                </div>


                <div class="payment-info">

                    <h3>
                        Pay with Monnify
                    </h3>

                    <p>
                        Secure payment
                    </p>

                    <span>
                        Card • Bank Transfer • USSD
                    </span>

                </div>


                <div class="payment-check">
                    ✓
                </div>

            </div>


            <!-- Future virtual account -->

            <div class="bank-transfer-card">

                <div class="bank-icon">
                    🏦
                </div>

                <div class="bank-info">

                    <h3>
                        Bank Transfer
                    </h3>

                    <p>
                        Your personal NovaPay account
                    </p>

                    <span>
                        Coming soon
                    </span>

                </div>

            </div>

        </section>


        <!-- ==============================
             CONTINUE
        =============================== -->

        <button
            id="continueBtn"
            class="continue-btn"
        >
            Continue
        </button>


        <p class="secure-note">
            🔒 Your payment is securely processed by Monnify
        </p>

    </main>


    <!-- ==============================
         MODAL
    =============================== -->

    <div id="customModal" class="modal">

        <div class="modal-content">

            <h3 id="modalTitle"></h3>

            <p id="modalMessage"></p>

            <button onclick="closeModal()">
                OK
            </button>

        </div>

    </div>


    <!-- ==============================
         JAVASCRIPT
    =============================== -->

    <script type="module" src="add-money.js"></script>

</body>
</html>
