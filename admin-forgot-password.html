<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>NovaPay Access Center - Forgot Password</title>

  <link
    rel="stylesheet"
    href="admin-forgot-password.css"
  >
</head>

<body>

  <main class="admin-access-page">

    <section class="admin-access-card" aria-labelledby="forgot-password-title">

      <div class="admin-brand">
        <div class="admin-brand-mark" aria-hidden="true">
          N
        </div>

        <div class="admin-brand-text">
          <h1>NovaPay</h1>
          <span>Access Center</span>
        </div>
      </div>


      <div class="admin-form-header">

        <h2 id="forgot-password-title">
          Forgot Password
        </h2>

        <p>
          Enter your admin UID to reset your password.
        </p>

      </div>


      <form
        id="admin-forgot-password-form"
        novalidate
      >

        <div class="form-group">

          <label for="admin-uid">
            Admin UID
          </label>

          <input
            type="text"
            id="admin-uid"
            name="uid"
            placeholder="Enter your admin UID"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
            required
          >

        </div>


        <div
          id="forgot-password-message"
          class="form-message"
          role="alert"
          aria-live="polite"
        ></div>


        <div
          id="new-password-container"
          class="new-password-container"
          hidden
        >

          <div class="new-password-header">
            <span class="success-icon" aria-hidden="true">
              ✓
            </span>

            <strong>
              Password Reset Successful
            </strong>
          </div>

          <p>
            Your new password is shown below. Save it securely before leaving this page.
          </p>

          <div class="new-password-box">

            <code
              id="new-password"
              aria-label="New password"
            ></code>

            <button
              type="button"
              id="copy-password-button"
              class="copy-password-button"
            >
              Copy
            </button>

          </div>

          <p class="password-warning">
            This password will not be shown again.
          </p>

        </div>


        <button
          type="submit"
          id="forgot-password-button"
          class="admin-submit-button"
        >
          Reset Password
        </button>

      </form>


      <div class="admin-back-link">

        <a href="admin-login.html">
          Back to Admin Login
        </a>

      </div>


      <div class="admin-security-note">

        <span
          class="security-icon"
          aria-hidden="true"
        >
          🔒
        </span>

        <span>
          Secure Admin Access
        </span>

      </div>

    </section>

  </main>


  <script src="admin-forgot-password.js"></script>

</body>
</html>
