<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Purchase Successful | NovaPay</title>

<link rel="stylesheet" href="success-airtime.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <div class="success-icon">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <h1>Purchase Successful</h1>

    <p>Your airtime purchase was completed successfully.</p>

    <section class="receipt-card">

        <div class="receipt-row">

            <span>Network</span>

            <strong id="network">-</strong>

        </div>

        <div class="receipt-row">

            <span>Phone Number</span>

            <strong id="phone">-</strong>

        </div>

        <div class="receipt-row">

            <span>Amount</span>

            <strong id="amount">-</strong>

        </div>

        <div class="receipt-row">

            <span>Reference</span>

            <strong id="reference">-</strong>

        </div>

    </section>

    <button class="done-btn">

        Back to Dashboard

    </button>

</div>

<script src="success-airtime.js"></script>

</body>

</html>
