<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Review Airtime | NovaPay</title>

<link rel="stylesheet" href="review-airtime.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="page-header">

        <button class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <div>

            <h1>Review Purchase</h1>

            <p>Confirm your airtime details</p>

        </div>

    </header>


    <!-- Summary Card -->

    <section class="summary-card">

        <div class="summary-row">

            <span>Network</span>

            <strong id="network">-</strong>

        </div>

        <div class="summary-row">

            <span>Phone Number</span>

            <strong id="phone">-</strong>

        </div>

        <div class="summary-row">

            <span>Amount</span>

            <strong id="amount">-</strong>

        </div>

        <div class="summary-row">

            <span>Save Beneficiary</span>

            <strong id="beneficiary">No</strong>

        </div>

    </section>


    <!-- Balance -->

    <section class="balance-card">

        <span>Wallet Balance</span>

        <strong>₦32,500.00</strong>

    </section>


    <!-- Confirm -->

    <button class="confirm-btn">

        Confirm Purchase

    </button>

</div>

<script src="review-airtime.js"></script>

</body>

</html>
