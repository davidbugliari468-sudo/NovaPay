<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Buy Airtime</title>

<link rel="stylesheet" href="airtime.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="airtime-page">

<!-- HEADER -->

<header class="page-header">

<button
id="backBtn"
class="back-btn">

<i class="fas fa-arrow-left"></i>

</button>

<div>

<h1>Buy Airtime</h1>

<p>

Purchase airtime for all networks.

</p>

</div>

<div class="header-space"></div>

</header>

<!-- SERVICE PROVIDER -->

<section class="section">

<h2>

Service Provider

</h2>

<div class="network-grid">

<div
class="network-card active"
data-network="MTN">

<img
src="images/mtn.png"
alt="MTN">

</div>

<div
class="network-card"
data-network="Airtel">

<img
src="images/airtel.png"
alt="Airtel">

</div>

<div
class="network-card"
data-network="Glo">

<img
src="images/glo.png"
alt="Glo">

</div>

<div
class="network-card"
data-network="9mobile">

<img
src="images/9mobile.png"
alt="9mobile">

</div>

</div>

</section> 
<!-- PHONE NUMBER -->

<section class="section">

<div class="section-title">

<h2>

Phone Number

</h2>

<button
type="button"
class="beneficiary-btn">

<i class="fas fa-user"></i>

Beneficiaries

</button>

</div>

<div class="input-card">

<input
type="tel"
id="phoneNumber"
placeholder="Enter phone number"
maxlength="11">

</div>

<label class="save-beneficiary">

<input
type="checkbox"
id="saveBeneficiary">

<span>

Save Beneficiary

</span>

</label>

</section>

<!-- TOP UP -->

<section class="section">

<h2>

Top Up

</h2>

<div class="amount-card">

<input
type="number"
id="amount"
placeholder="₦ Enter amount">

<div class="balance-row">

<div>

<i class="fas fa-wallet"></i>

<span>

Wallet Balance

</span>

</div>

<strong
id="walletBalance">

₦0.00

</strong>

</div>

</div>

</section> 
<!-- CONTINUE BUTTON -->

<button
id="continueBtn"
class="continue-btn">

Continue

</button>

<p
id="airtimeMessage"
class="airtime-message">

</p>

</div>

<script
src="airtime.js">

</script>

</body>

</html>
