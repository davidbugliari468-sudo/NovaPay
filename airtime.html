<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buy Airtime | NovaPay</title>

<link rel="stylesheet" href="airtime.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header class="page-header">

        <button class="back-btn">

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <div>

            <h1>Buy Airtime</h1>

            <p>Purchase airtime</p>

        </div>

    </header>



    <!-- AVAILABLE BALANCE -->

    <section class="balance-card">

        <div class="balance-info">

            <p>Available Balance</p>

            <h2>₦32,500.00</h2>

        </div>

        <button class="wallet-btn">

            <i class="fa-solid fa-wallet"></i>

        </button>

    </section>



    <!-- NETWORK -->

    <section class="network-section">

        <h3>Select Network</h3>

        <div class="network-scroll">

            <button class="network-card">

                MTN

            </button>

            <button class="network-card">

                Airtel

            </button>

            <button class="network-card">

                9mobile

            </button>

            <button class="network-card">

                Glo

            </button>

        </div>

    </section>



    <!-- PHONE NUMBER -->

    <section class="phone-section">

        <input
        type="tel"
        id="phone"
        placeholder="Enter phone number">

        <label class="save-box">

            <input type="checkbox">

            <span>Save Beneficiary</span>

        </label>

    </section>



    <!-- AMOUNT -->

    <section class="amount-section">

        <h3>Select Amount</h3>

        <div class="amount-grid">

            <button class="amount-btn">₦100</button>

            <button class="amount-btn">₦200</button>

            <button class="amount-btn">₦500</button>

            <button class="amount-btn">₦1000</button>

            <button class="amount-btn">₦2000</button>

            <button class="amount-btn">₦5000</button>

        </div>

        <p class="other-title">

            Other Amount

        </p>

        <input
        type="number"
        id="customAmount"
        placeholder="₦ Enter custom amount">

    </section>



    <!-- CONTINUE -->

    <button class="continue-btn">

        Continue

    </button>

</div>

<script src="airtime.js"></script>

</body>

</html>
