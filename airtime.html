<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Buy Airtime</title>

<link rel="stylesheet"
href="airtime.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<header class="top-bar">

<button
id="backBtn"
class="back-btn">

←

</button>

<div>

<h1>Buy Airtime</h1>

<p>Purchase airtime for all networks.</p>

</div>

</header>

<section class="provider-section">

<h2>Service Provider</h2>

<div class="providers"> 
    <div class="provider active" data-network="mtn">
    <img src="images/mtn.png" alt="MTN">
</div>

<div class="provider" data-network="glo">
    <img src="images/glo.png" alt="Glo">
</div>

<div class="provider" data-network="airtel">
    <img src="images/airtel.png" alt="Airtel">
</div>

<div class="provider" data-network="9mobile">
    <img src="images/9mobile.png" alt="9mobile">
</div>

</div>

</section>

<section class="phone-section">

<div class="section-title">

<h2>Phone Number</h2>

<button
id="beneficiaryBtn"
class="beneficiary-btn">

👤 Beneficiaries

</button>

</div>

<input
type="tel"
id="phoneNumber"
placeholder="Enter phone number"
maxlength="11"
inputmode="numeric">

<label class="save-beneficiary">

<input
type="checkbox"
id="saveBeneficiary">

<span>Save Beneficiary</span>

</label>

</section> 
<section class="amount-section">

<h2>Top Up</h2>

<div class="amount-card">

<div class="amount-input">

<span class="naira">₦</span>

<input
type="text"
id="amount"
placeholder="Enter amount"
inputmode="numeric"
autocomplete="off">

</div>

<hr>

<div class="wallet-row">

<div class="wallet-left">

💳 Wallet Balance

</div>

<div
id="walletBalance"
class="wallet-balance">

₦0.00

</div>

</div>

</div>

</section>

<button
id="continueBtn"
class="continue-btn">

Continue

</button>

<div
id="loadingOverlay"
class="loading-overlay hidden">

<div class="loader"></div>

<p>Please wait...</p>

</div>

<div
id="messageBox"
class="message-box hidden">

</div>

</div>

<script type="module" src="airtime.js"></script>

</body>
</html>
