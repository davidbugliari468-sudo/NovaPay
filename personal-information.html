<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Information - NovaPay</title>

    <link
        rel="stylesheet"
        href="personal-information.css"
    >
</head>

<body>

    <div class="personal-page">

        <!-- HEADER -->

        <header class="personal-header">

            <button
                class="back-btn"
                type="button"
                onclick="history.back()"
                aria-label="Go back"
            >
                ←
            </button>

            <h1>Personal Information</h1>

        </header>


        <!-- PROFILE -->

        <section class="profile-summary">

            <div class="profile-avatar">
                <span>👤</span>
            </div>

            <h2>Personal Information</h2>

            <p>Your account information</p>

        </section>


        <!-- PERSONAL DETAILS -->

        <section class="information-section">

            <h3>PERSONAL DETAILS</h3>

            <div class="information-card">

                <div class="information-row">

                    <div class="row-icon">
                        👤
                    </div>

                    <div class="row-content">

                        <span>Full Name</span>

                        <strong>
                            Not available
                        </strong>

                    </div>

                </div>


                <div class="information-row">

                    <div class="row-icon">
                        📧
                    </div>

                    <div class="row-content">

                        <span>Email</span>

                        <strong>
                            Not available
                        </strong>

                    </div>

                </div>


                <div class="information-row">

                    <div class="row-icon">
                        📱
                    </div>

                    <div class="row-content">

                        <span>Phone Number</span>

                        <strong>
                            Not available
                        </strong>

                    </div>

                </div>

            </div>

        </section>


        <!-- ACCOUNT INFORMATION -->

        <section class="information-section">

            <h3>ACCOUNT</h3>

            <div class="information-card">

                <div class="information-row">

                    <div class="row-icon">
                        🆔
                    </div>

                    <div class="row-content">

                        <span>User ID</span>

                        <strong>
                            Not available
                        </strong>

                    </div>

                </div>


                <div class="information-row">

                    <div class="row-icon">
                        📅
                    </div>

                    <div class="row-content">

                        <span>Date Joined</span>

                        <strong>
                            Not available
                        </strong>

                    </div>

                </div>


                <div class="information-row">

                    <div class="row-icon">
                        🛡️
                    </div>

                    <div class="row-content">

                        <span>Verification</span>

                        <strong class="tier-status">
                            Tier 1 · Basic
                        </strong>

                    </div>

                </div>

            </div>

        </section>


    </div>

</body>

</html>
